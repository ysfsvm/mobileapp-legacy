name: Legacy watches

# Builds and tests the Android debug app of this fork and keeps the APK.
# A tag named like legacy-1 also publishes the APK as a GitHub release.
# Core's own workflow also builds iOS; it is switched off for the fork.

on:
  push:
    branches: [legacy, 'dev/**', 'feature/**']
    tags: ['legacy-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch --tags --force
      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-deps-${{ runner.os }}-${{ hashFiles('gradle/**', 'gradlew*', 'gradle.properties', '*.gradle*') }}
          restore-keys: |
            android-deps-${{ runner.os }}-
      - name: Use the fork's debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Without the secret (a fork of this fork, a pull request from one) the build
          # makes its own debug key; such an APK cannot update an installed one.
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          fi
      - name: Use dummy google-services json
        run: mv androidApp/src/google-services-dummy.json androidApp/src/google-services.json
      - name: Build and Test
        run: ./gradlew :androidApp:assembleDebug testDebugUnitTest testAndroidHostTest jvmTest
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Show the APK's signing certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs androidApp/build/outputs/apk/debug/*.apk | grep -i "SHA-256"
      - name: Store the APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/*.apk

  release:
    needs: android
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/legacy-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: androidApp-debug
          path: apk
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv apk/*.apk "pebble-legacy-app-${TAG}.apk"
          sha256sum "pebble-legacy-app-${TAG}.apk" > SHA256SUMS.txt
          cat > notes.md <<'EOF'
          Core Devices' Pebble app with the changes legacy watches on the PebbleOS port need.
          Not made or supported by Core Devices.

          This is a debug build. It has no sign-in, so what needs Core's servers is off. It has
          the same package name as Core's app from the store: remove that one first.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes-file notes.md --prerelease "pebble-legacy-app-${TAG}.apk" SHA256SUMS.txt
